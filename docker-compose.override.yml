services:
  brillante-db:
    ports:
      - "3307:3306"
    networks:
      - brillante
      - app

  brillante-phpmyadmin:
    networks:
      - brillante
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-phpmyadmin.rule=Host(`${PHPMYADMIN_DOMAIN_NAME}`)"
      - "traefik.docker.network=app"

  brillante-vite:
    image: node:22
    container_name: ${PROJECT_NAME}-vite
    working_dir: /app
    user: "root"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - brillante
      - app
    ports:
      - "5174:5174" # Puerto configurado en vite.config.js
    labels:
      - traefik.enable=false

networks:
  app:
    external: true