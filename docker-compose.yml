services:
  brillante-php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ${PROJECT_NAME}-php
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www
    networks:
      - brillante
    environment:
      PROJECT_NAME: ${PROJECT_NAME}

  brillante-nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}-nginx
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - brillante-php
    networks:
      - brillante

  brillante-db:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-aaa}
    labels:
      - traefik.enable=false
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - brillante

  brillante-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${PROJECT_NAME}-phpmyadmin
    environment:
      PMA_HOST: ${PROJECT_NAME}-db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-aaa}
    depends_on:
      - ${PROJECT_NAME}-db
    networks:
      - brillante
    labels:
      - traefik.enable=false

volumes:
  dbdata:

networks:
  brillante:
    driver: bridge
