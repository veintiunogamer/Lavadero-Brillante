# Configuración de DESARROLLO (solo local)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Este archivo NO se auto-carga (a diferencia de docker-compose.override.yml),
# por lo que es seguro tenerlo en producción: un plain `docker compose up -d`
# en el server solo levantaría docker-compose.yml.
services:
  brillante-db:
    ports:
      - "3307:3306"
    networks:
      - brillante
      - app

  brillante-nginx:
    networks:
      - brillante
      - app
    ports:
      - "8000:80" # Acceso directo sin Traefik (solo dev)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=http"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=app"

  brillante-phpmyadmin:
    networks:
      - brillante
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${PROJECT_NAME}-phpmyadmin.rule=Host(`${PHPMYADMIN_DOMAIN_NAME}`)"
      - "traefik.docker.network=app"

  brillante-vite:
    image: node:22
    container_name: ${PROJECT_NAME}-vite
    working_dir: /app
    user: "root"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - brillante
      - app
    ports:
      - "5174:5174" # Puerto configurado en vite.config.js
    labels:
      - traefik.enable=false

networks:
  app:
    external: true